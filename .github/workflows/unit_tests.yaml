# This workflow will install Python dependencies, run tests the specified Python version
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions
name: Python 3.12 tests

on:
  push:
    branches: 
      - develop
      - develop-ref
      - feature_*
      - main_*
      - bugfix_*    
      - test_*
    paths-ignore:
      - 'docs/**'
      - '.github/pull_request_template.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '**/README.md'
      - '**/LICENSE.md'

  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        # Define the branches to run.
        # For PRs, we include both the PR branch and 'develop'.
        # For push events, we just use the branch that triggered the workflow.
        branch: ${{ github.event_name == 'pull_request' && fromJSON('["' + github.head_ref + '", "develop"]') || fromJSON('["' + github.ref_name + '"]') }}

    steps:
    # checkout METplotpy
    - uses: actions/checkout@v4
      with:
        ref: ${{ matrix.branch }}

    # checkout METcalcpy
    - uses: actions/checkout@v4
      with:
        repository: dtcenter/METcalcpy
        path: METcalcpy
        ref: develop

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e METcalcpy
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install --upgrade kaleido

    - name: Test with pytest
      run: |
        export METPLOTPY_TEST_OUTPUT=/data/${{ matrix.branch }}
        pytest

    - name: Upload output data artifact
      uses: actions/upload-artifact@v4
      with:
        name: test_output_${{ matrix.branch }}
        path: /data/${{ matrix.branch }}
