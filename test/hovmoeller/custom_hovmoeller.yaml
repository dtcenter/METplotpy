plot_filename: !ENV '${TEST_OUTPUT}/hovmoeller_custom_plot.png'
input_data_file: !ENV '${TEST_INPUT_EXTRA}/hovmoeller/precip.erai.sfc.1p0.2x.2014-2016.nc'
plot_height: 800
plot_width: 1200
title: ERAI Precipitation
title_size: 20
xy_label_font_size: 20

date_start: 2016-01-01
date_end: 2016-03-31

lat_max: 5
lat_min: -5

var_name: precip
var_units: mm / day
unit_conversion: 250

contour_min: 0.2
contour_max: 1.6
contour_del: 0.2
colorscale: 'BuPu'

