plot_filename: erai_precip.png
input_data_file: ./precip.erai.sfc.1p0.2x.2014-2016.nc

plot_height: 800
plot_width: 1200
# plot title
title: ERAI Precipitation

# Font size for the x-axis and y-axis labels and the title font size
xy_label_font_size: 20
title_size: 20

# xaxis title
xaxis: Longitude
# yaxis title
yaxis: Time

date_start: 2016-01-01
date_end: 2016-03-31

lat_max: 5
lat_min: -5

var_name: precip
var_units: mm / day
unit_conversion: 250

contour_min: 0.2
contour_max: 1.6
contour_del: 0.2
colorscale: 'BuPu'

log_level: ERROR
log_filename: stdout


# not used in this plot, but needed by the base config
plot_units: in
xlab_align: 0.5
xlab_offset: 2
xlab_size: 1
xlab_weight: 1
xlim: []
xtlab_decim: 0
xtlab_horiz: 0.5
xtlab_orient: 1
xtlab_perp: -0.75
xtlab_size: 1
y2lab_align: 0.5
y2lab_offset: 1
y2lab_size: 1
y2lab_weight: 1
y2lim: []
y2tlab_horiz: 0.5
y2tlab_orient: 1
y2tlab_perp: 1
y2tlab_size: 1.0
yaxis_1: test y_label
yaxis_2: ''
ylab_align: 0.5
ylab_offset: -2
ylab_size: 1
ylab_weight: 1
ylim: []
ytlab_horiz: 0.5
ytlab_orient: 1
ytlab_perp: 0.5
ytlab_size: 1
caption_align: 0.0
caption_col: '#333333'
caption_offset: 3.0
caption_size: 0.8
caption_weight: 1
title_align: 0.5
title_offset: -2
title_weight: 2.0
legend_box: o
legend_inset:
  x: 0.0
  y: -0.25
legend_ncol: 1
legend_size: 0.8
mar:
- 8.0
- 4.0
- 5.0
- 4.0