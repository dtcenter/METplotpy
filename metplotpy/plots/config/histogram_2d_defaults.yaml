plot_filename: './tmp_z2_p500.png'

height: 800
width: 1200
font_size: 20
plot_units: in

# Add these settings, they are not currently used but needed in METviewer

title_weight: 4
title_align: 0.5
title_offset: -2
title_size: 1.8
plot_caption: "This is caption"
caption_weight: 4
caption_col: "#ff0000"
caption_size: "1.3" # relative magnification
caption_offset: 2.95  # axis perpendicular location adjustment (up/down 3.8 is max value, 2.9 is min value)
caption_align: -.1 # axis parallel location adjustment (left/right)
legend_box: o
legend_inset:
  x: 0.0
  y: -0.25
legend_ncol: 1
legend_size: 0.8

xlab_align: 0.5
xlab_offset: 2
xlab_size: 1
xlab_weight: 1
x2lab_align: 0.5
x2lab_offset: -0.5
x2lab_size: 0.8
x2lab_weight: 1
x2tlab_horiz: 0.5
x2tlab_orient: 1
x2tlab_perp: 1
x2tlab_size: 0.8
xaxis: test x_label
xaxis_reverse: 'False'
xtlab_decim: 0
xtlab_horiz: 0.5
xtlab_orient: 1
xtlab_perp: -0.75
xtlab_size: 1
y2lab_align: 0.5
y2lab_offset: 1
y2lab_size: 1
y2lab_weight: 1
y2lim: []
y2tlab_horiz: 0.5
y2tlab_orient: 1
y2tlab_perp: 1
y2tlab_size: 1.0
yaxis_1: test y_label
yaxis_2: ''
ylab_align: 0.5
ylab_offset: -2
ylab_size: 1
ylab_weight: 1
ylim: []
ytlab_horiz: 0.5
ytlab_orient: 1
ytlab_perp: 0.5
ytlab_size: 1

# use this var_name when running with --test (create test data)
# argument, otherwise, set it to correspond to the variable of interest
# in your data set if you want something other than hist_x_y
#var_name: 'hist_x_y'
var_name: 'hist_TMP_Z2_TMP_P500'


# Use for running with --test
#title: 'Probability Distribution Function'
title: '2D Histogram of TMP Z2 and TMP_P500 values '
xaxis_title: 'x'
yaxis_title: 'y'

normalize_to_pdf: False

pdf_min: 0.0
pdf_max: 4.0

log_level: ERROR
log_filename: stdout
